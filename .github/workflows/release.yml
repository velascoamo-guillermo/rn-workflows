name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  # Required for npm provenance attestation (works with NPM_TOKEN today,
  # and is the only permission change needed for npm trusted publishing/OIDC).
  id-token: write

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node (npm registry)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Tag and package.json agree on version $PKG_VERSION"

      - name: Run tests
        run: bun test

      - name: Build
        run: bun run build

      # npm trusted publishing (OIDC) requires npm >= 11.5.1; node 22 ships npm 10.x.
      - name: Update npm for trusted publishing
        run: npm install -g npm@latest

      # Prereleases go to the `beta` dist-tag so `npm install rn-workflows`
      # keeps resolving to the latest stable; npm >= 11 refuses to publish a
      # prerelease without an explicit tag.
      - name: Publish to npm
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            npm publish --provenance --access public --tag beta
          else
            npm publish --provenance --access public
          fi
